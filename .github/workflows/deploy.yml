name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies to install — the app and its tests are dependency-free.
      - name: Run formula tests
        run: npm test
      - name: Check the icons are in step with the generator
        run: |
          node tools/make-icons.mjs
          git diff --exit-code -- icons/ \
            || (echo "::error::icons/ is out of date — run 'npm run icons' and commit the result" && exit 1)

  deploy:
    name: Deploy to Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions block REPLACES the top-level one rather than
      # adding to it, so contents: read has to be repeated here or checkout
      # cannot read the repository.
      contents: read
      pages: write
      id-token: write
    # NOTE: deliberately no `environment: github-pages` block here.
    #
    # The usual Pages template declares that environment, but this repository's
    # github-pages environment was created while the default branch was still
    # the original feature branch, so its deployment-branch rule rejects main.
    # With the block present the job was refused before it started — it failed
    # in two seconds with no steps and no logs. Deploying without declaring the
    # environment works; the only thing lost is the environment link in the
    # repository sidebar.
    #
    # To restore it: Settings -> Environments -> github-pages -> Deployment
    # branches, allow main, then add the block back.
    steps:
      - uses: actions/checkout@v4
      # Pages must be enabled once by the repository owner:
      #   Settings -> Pages -> Source: GitHub Actions
      # The workflow token is not permitted to create the Pages site itself
      # ("Resource not accessible by integration"), so this cannot be automated.
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site — there is no build step.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
